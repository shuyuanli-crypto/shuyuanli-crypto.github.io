{{ define "main" }}
<article class="wrap page forum-article">
  <p class="eyebrow"><a href="/forum/">← Forum</a></p>
  <h1>{{ .Title }}</h1>
  <p class="meta">{{ .Date.Format "January 2, 2006" }}{{ with .Params.author }} · {{ . }}{{ end }}</p>
  {{ .Content }}
  {{ with .Params.tags }}
  <p class="tags">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</p>
  {{ end }}
  <div class="discussion">
    <h3>Discussion</h3>
    <script src="https://giscus.app/client.js"
            data-repo="shuyuanli-crypto/shuyuanli-crypto.github.io"
            data-repo-id="R_kgDOT-gqZQ"
            data-category="General"
            data-category-id="DIC_kwDOT-gqZc4DEUrn"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="light"
            data-lang="en"
            crossorigin="anonymous"
            async>
    </script>
  </div>
</article>
{{ end }}
