<style>
/* ===== Portfolio (scroll storytelling) ===== */
.pf {
  --pf-bg: #FFFFFF;
  --pf-cream: #FAF6F1;
  --pf-ink: #1A1A1A;
  --pf-muted: #5A5550;
  --pf-line: #E5DDD0;
  --pf-gold: #B8925A;
  --pf-gold-soft: rgba(184,146,90,0.16);
  --pf-pill: #F0E6D6;
  --pf-wine: #8E3B46;
  --pf-ease: cubic-bezier(.22,.61,.36,1);
  background: var(--pf-bg);
  color: var(--pf-ink);
  overflow-x: clip;
}
.dark .pf {
  --pf-bg: #121212;
  --pf-cream: #1C1A17;
  --pf-ink: #F2EDE6;
  --pf-muted: #B5ADA3;
  --pf-line: #3A342C;
  --pf-gold-soft: rgba(184,146,90,0.22);
  --pf-pill: #3A3126;
  --pf-wine: #D07A86;
}
.pf h1, .pf h2, .pf h3 { font-family: 'Playfair Display', Georgia, serif; text-wrap: balance; }
.pf p, .pf li, .pf figcaption, .pf-stat > span { text-wrap: pretty; }
.pf-wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

/* progress bar */
.pf-progress { position: fixed; left: 0; top: 0; height: 3px; width: 100%; z-index: 60; pointer-events: none; }
.pf-progress-bar { height: 100%; width: 100%; background: var(--pf-gold); transform-origin: 0 50%; transform: scaleX(0); }

/* chapter rail (desktop) */
.pf-rail { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); z-index: 40; display: none; flex-direction: column; gap: 14px; opacity: 0; transition: opacity .4s; }
.pf-rail.is-on { opacity: 1; }
.pf-rail a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--pf-muted); font-size: 12px; letter-spacing: .08em; }
.pf-rail a span { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--pf-line); display: grid; place-items: center; font-weight: 600; background: var(--pf-bg); transition: all .3s; }
.pf-rail a em { font-style: normal; opacity: 0; transform: translateX(-6px); transition: all .3s; text-transform: uppercase; }
.pf-rail a:hover em, .pf-rail a.is-active em { opacity: 1; transform: none; }
.pf-rail a.is-active span { background: var(--pf-gold); border-color: var(--pf-gold); color: #fff; }
@media (min-width: 1360px) { .pf-rail { display: flex; } }

/* hero */
.pf-hero { background: var(--pf-cream); padding: 88px 0 72px; text-align: center; position: relative; }
.pf-eyebrow { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--pf-gold); }
.pf-hero h1 { font-size: clamp(2.2rem, 5.4vw, 4rem); line-height: 1.08; margin: 18px auto 0; max-width: 18ch; font-weight: 700; }
.pf-hero h1 .pf-w { display: inline-block; }
.pf-hero h1 em { font-style: italic; color: var(--pf-gold); }
.pf-hero-intro { max-width: 620px; margin: 22px auto 0; font-size: 1.08rem; line-height: 1.65; color: var(--pf-muted); }

/* pipeline (hero + chapter mini) */
.pf-pipe { position: relative; display: flex; justify-content: space-between; max-width: 760px; margin: 52px auto 0; padding: 0 6px; }
.pf-pipe::before, .pf-pipe::after { content: ""; position: absolute; left: 22px; right: 22px; top: 11px; height: 2px; background: var(--pf-line); }
.pf-pipe::after { background: var(--pf-gold); transform-origin: 0 50%; transform: scaleX(var(--pf-fill, 1)); }
.pf-pipe li { list-style: none; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 20%; font-size: 13px; font-weight: 600; color: var(--pf-ink); }
.pf-pipe li::before { content: ""; width: 24px; height: 24px; border-radius: 50%; background: var(--pf-bg); border: 2px solid var(--pf-gold); box-sizing: border-box; transition: background .4s, transform .4s var(--pf-ease); }
.pf-pipe li.on::before { background: var(--pf-gold); }
.pf-pipe-mini { margin: 26px 0 0; max-width: 520px; padding: 0; }
.pf-pipe-mini li { font-size: 11px; font-weight: 500; color: var(--pf-muted); }
.pf-pipe-mini li.on { color: var(--pf-ink); font-weight: 600; }
.pf-pipe-mini li::before { width: 16px; height: 16px; border-color: var(--pf-line); }
.pf-pipe-mini li.on::before { border-color: var(--pf-gold); }
.pf-pipe-mini::before, .pf-pipe-mini::after { top: 7px; }
.pf-pipe-mini::after { display: none; }

.pf-cue { margin-top: 56px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--pf-muted); display: inline-flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; }
.pf-cue i { width: 1px; height: 38px; background: linear-gradient(var(--pf-gold), transparent); animation: pf-cue 1.8s var(--pf-ease) infinite; transform-origin: top; }
@keyframes pf-cue { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

/* chapter */
.pf-chapter { padding: 110px 0 40px; border-top: 1px solid var(--pf-line); scroll-margin-top: 60px; }
.pf-head { max-width: 760px; }
.pf-layer { display: inline-flex; gap: 10px; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--pf-gold); }
.pf-layer::before { content: ""; width: 28px; height: 1px; background: var(--pf-gold); }
.pf-title { display: flex; align-items: baseline; gap: 18px; margin-top: 14px; }
.pf-num { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(3rem, 7vw, 5.2rem); line-height: 1; color: transparent; -webkit-text-stroke: 1px var(--pf-gold); }
.pf-brand { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.02; letter-spacing: .02em; margin: 0; overflow: hidden; }
.pf-brand > span { display: inline-block; }
.pf-brand small { display: block; font-family: 'Inter', sans-serif; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--pf-muted); font-weight: 500; margin-top: 8px; }
.pf-role { margin-top: 18px; font-size: 15px; color: var(--pf-ink); font-weight: 600; }
.pf-role span { color: var(--pf-muted); font-weight: 400; }
.pf-lede { margin-top: 14px; font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.25rem, 2.4vw, 1.6rem); line-height: 1.35; font-style: italic; }
.pf-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding: 0; }
.pf-facts li { list-style: none; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; background: var(--pf-cream); border: 1px solid var(--pf-line); color: var(--pf-muted); }

/* story: sticky visual + steps */
.pf-story { display: grid; grid-template-columns: 1fr; gap: 0; margin-top: 40px; position: relative; }
.pf-visual-wrap { position: sticky; top: 64px; z-index: 3; background: var(--pf-bg); padding: 10px 0; }
.pf-visual { position: relative; height: 34vh; min-height: 210px; max-height: 340px; border-radius: 18px; background: var(--pf-cream); border: 1px solid var(--pf-line); overflow: hidden; }
.pf-visual svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pf-stage { position: absolute; left: 16px; top: 14px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--pf-gold); }
.pf-steps { position: relative; z-index: 1; }
.pf-step { min-height: 62vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0; }
.pf-step-label { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--pf-gold); }
.pf-step h3 { font-size: clamp(1.45rem, 2.6vw, 2rem); line-height: 1.2; margin: 10px 0 14px; }
.pf-step p { color: var(--pf-muted); line-height: 1.7; font-size: 1.02rem; margin: 0; }
.pf-step ul { margin: 6px 0 0; padding: 0; }
.pf-step li { list-style: none; position: relative; padding: 9px 0 9px 26px; line-height: 1.55; color: var(--pf-ink); border-bottom: 1px solid var(--pf-line); }
.pf-step li:last-child { border-bottom: 0; }
.pf-step li::before { content: ""; position: absolute; left: 2px; top: 17px; width: 12px; height: 2px; background: var(--pf-gold); }
.pf-stats { display: flex; flex-wrap: wrap; gap: 28px 40px; margin: 6px 0 20px; }
.pf-stat b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: clamp(2.4rem, 5vw, 3.4rem); line-height: 1; color: var(--pf-gold); font-weight: 700; }
.pf-stat b small { font-size: .42em; font-family: 'Inter', sans-serif; font-weight: 600; color: var(--pf-ink); margin-left: 4px; }
.pf-stat > span { display: block; margin-top: 8px; font-size: 13.5px; color: var(--pf-muted); max-width: 22ch; line-height: 1.45; }
.pf-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding: 0; }
.pf-chips li { border: 0 !important; padding: 5px 12px !important; border-radius: 999px; background: var(--pf-gold-soft); font-size: 13px; color: var(--pf-ink); }
.pf-chips li::before { display: none; }

@media (min-width: 900px) {
  .pf-story { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 64px; align-items: start; }
  .pf-visual-wrap { top: 110px; padding: 0; order: 2; }
  .pf-visual { height: min(68vh, 520px); max-height: none; }
  .pf-steps { order: 1; }
  .pf-step { min-height: 78vh; }
}

/* ---- SVG visual primitives ---- */
.pf svg text { font-family: 'Inter', sans-serif; fill: var(--pf-ink); }
.pf .v-muted { fill: var(--pf-muted); }
.pf .v-axis { stroke: var(--pf-line); stroke-width: 1.5; }
.pf .v-line { fill: none; stroke: var(--pf-gold); stroke-width: 3; stroke-linecap: round; }
.pf .v-thin { fill: none; stroke: var(--pf-gold); stroke-width: 1.6; stroke-linecap: round; }
.pf .v-node { fill: var(--pf-bg); stroke: var(--pf-gold); stroke-width: 2; }
.pf .v-fill { fill: var(--pf-gold); }
.pf .v-ink { fill: var(--pf-ink); }
.pf .v-wine { fill: var(--pf-wine); }
.pf .v-card { fill: var(--pf-bg); stroke: var(--pf-line); stroke-width: 1; }
.pf .v-pill { fill: var(--pf-pill); }
.pf .v-big { font-family: 'Playfair Display', Georgia, serif !important; font-weight: 700; fill: var(--pf-gold) !important; }

/* animation states: only when JS is running */
.pf.js-on .a { opacity: 0; transition: opacity .7s var(--pf-ease), transform .7s var(--pf-ease); transform-box: fill-box; transform-origin: center; }
.pf.js-on .a.up { transform: translateY(14px); }
.pf.js-on .a.pop { transform: scale(.6); }
.pf.js-on .draw { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000); transition: stroke-dashoffset 1.4s var(--pf-ease); }
.pf.js-on .s1 .a.at1, .pf.js-on .s2 .a.at2, .pf.js-on .s3 .a.at3 { opacity: 1; transform: none; }
.pf.js-on .s1 .draw.at1, .pf.js-on .s2 .draw.at2, .pf.js-on .s3 .draw.at3 { stroke-dashoffset: 0; }
.pf.js-on .s2 .gone2, .pf.js-on .s3 .gone3 { opacity: 0 !important; }
.pf.js-on .d1 { transition-delay: .12s; } .pf.js-on .d2 { transition-delay: .24s; } .pf.js-on .d3 { transition-delay: .36s; } .pf.js-on .d4 { transition-delay: .48s; } .pf.js-on .d5 { transition-delay: .6s; } .pf.js-on .d6 { transition-delay: .72s; }

/* Chanel segmentation dots recolor */
.pf .seg-dot { fill: var(--pf-line); transition: fill .6s var(--pf-ease); }
.pf .s2 .seg-dot.g { fill: var(--pf-gold); } .pf .s2 .seg-dot.k { fill: var(--pf-ink); } .pf .s2 .seg-dot.w { fill: var(--pf-wine); }
.pf .ab-bar { transform-box: fill-box; transform-origin: bottom; transition: transform 1.1s var(--pf-ease); }
.pf.js-on .ab-bar { transform: scaleY(0); }
.pf.js-on .s3 .ab-bar { transform: scaleY(1); }
/* friction pulse */
.pf .s2 .pulse { animation: pf-pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pf-pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
/* Byredo scattered data jitter */
.pf .s1 .jit { animation: pf-jit 2.4s ease-in-out infinite alternate; }
.pf .s2 .jit, .pf .s3 .jit { animation: none; }
@keyframes pf-jit { to { transform: translate(4px, -5px); } }
.pf .hub-glow { opacity: 0; transition: opacity .8s; }
.pf .s3 .hub-glow { opacity: 1; }

/* text reveals */
.pf.js-on .rv { opacity: 0; transform: translateY(22px); transition: opacity .8s var(--pf-ease), transform .8s var(--pf-ease); }
.pf.js-on .rv.is-in { opacity: 1; transform: none; }
.pf.js-on .pf-brand > span { transform: translateY(105%); transition: transform 1s var(--pf-ease); }
.pf.js-on .pf-head.is-in .pf-brand > span { transform: none; }
.pf.js-on .pf-step { opacity: .28; transition: opacity .5s; }
.pf.js-on .pf-step.is-active { opacity: 1; }
.pf.js-on .pf-hero .pf-w { opacity: 0; transform: translateY(0.5em); animation: pf-word .9s var(--pf-ease) forwards; }
@keyframes pf-word { to { opacity: 1; transform: none; } }
.pf.js-on .pf-hero .pf-pipe li { opacity: 0; animation: pf-word .7s var(--pf-ease) forwards; }
.pf.js-on .pf-hero .pf-pipe::after { animation: pf-fill 2.2s .9s var(--pf-ease) both; }
@keyframes pf-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ICICLE email showcase */
.pf-mails { margin-top: 40px; padding: 56px 0 8px; border-top: 1px solid var(--pf-line); }
.pf-mails-head { max-width: 640px; }
.pf-mails-head h3 { font-size: clamp(1.45rem, 2.6vw, 2rem); line-height: 1.2; margin: 10px 0 10px; }
.pf-mails-head p { color: var(--pf-muted); line-height: 1.65; margin: 0; }
.pf-mail-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 36px; }
.pf-mail { margin: 0; }
.pf-mail-frame { position: relative; height: 560px; border-radius: 16px; overflow-y: auto; background: var(--pf-cream); border: 1px solid var(--pf-line); box-shadow: 0 18px 40px -24px rgba(26,26,26,.35); }
.pf-mail-frame img { display: block; width: 100%; height: auto; will-change: transform; }
.pf.js-on .pf-mail-frame { overflow: hidden; }
.pf-mail-frame::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(transparent, rgba(0,0,0,.06)); pointer-events: none; }
.pf-mail figcaption { margin-top: 14px; }
.pf-mail figcaption b { display: block; font-size: 14.5px; font-weight: 600; color: var(--pf-ink); }
.pf-mail figcaption span { display: block; margin-top: 4px; font-size: 13.5px; line-height: 1.5; color: var(--pf-muted); }
.pf.js-on .pf-mail { opacity: 0; transform: translateY(40px); transition: opacity .9s var(--pf-ease), transform .9s var(--pf-ease); }
.pf.js-on .pf-mail-row.is-in .pf-mail { opacity: 1; transform: none; }
.pf.js-on .pf-mail-row.is-in .pf-mail:nth-child(2) { transition-delay: .15s; }
.pf.js-on .pf-mail-row.is-in .pf-mail:nth-child(3) { transition-delay: .3s; }
@media (max-width: 899px) {
  .pf-mail-row { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; margin-right: -24px; padding-right: 24px; padding-bottom: 8px; }
  .pf-mail { flex: 0 0 76%; scroll-snap-align: start; }
  .pf-mail-frame { height: 440px; }
}

/* email viewer */
.pf-mail-frame { cursor: zoom-in; }
.pf-mail-hint { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2; padding: 8px 16px; border-radius: 999px; border: 0; background: rgba(26,26,26,.82); color: #fff; font: 600 12.5px 'Inter', sans-serif; letter-spacing: .02em; white-space: nowrap; cursor: pointer; transition: opacity .3s, transform .3s; }
@media (hover: hover) { .pf-mail-hint { opacity: 0; transform: translate(-50%, 6px); } .pf-mail-frame:hover .pf-mail-hint, .pf-mail-hint:focus-visible { opacity: 1; transform: translateX(-50%); } }
.pf-viewer { position: fixed; inset: 0; z-index: 100; background: rgba(18,18,18,.82); display: flex; justify-content: center; opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
.pf-viewer.is-open { opacity: 1; visibility: visible; }
.pf-viewer-scroll { width: 100%; max-width: 680px; height: 100%; overflow-y: auto; padding: 64px 16px 40px; box-sizing: border-box; overscroll-behavior: contain; }
.pf-viewer-scroll img { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
.pf-viewer-cap { color: #EDE6DC; font: 500 14px/1.5 'Inter', sans-serif; margin: 16px 4px 0; text-align: center; }
.pf-viewer-close { position: fixed; top: 16px; right: 16px; z-index: 101; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #FAF6F1; color: #1A1A1A; font-size: 22px; line-height: 44px; cursor: pointer; }
.pf-viewer-close:hover { background: #B8925A; color: #fff; }
html.pf-lock { overflow: hidden; }

/* outro */
.pf-outro { background: var(--pf-ink); color: #FAF6F1; text-align: center; padding: 96px 0; margin-top: 60px; }
.dark .pf-outro { background: #1C1A17; }
.pf-outro h2 { font-size: clamp(2rem, 4.4vw, 3rem); margin: 14px 0 0; color: #FAF6F1; }
.pf-outro p { max-width: 560px; margin: 18px auto 0; color: #CFC7BC; line-height: 1.65; }
.pf-btns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 34px; }
.pf-btn { display: inline-block; padding: 13px 26px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; transition: transform .25s, opacity .25s; }
.pf-btn:hover { transform: translateY(-2px); }
.pf-btn-gold { background: var(--pf-gold); color: #fff; }
.pf-btn-line { border: 1px solid rgba(250,246,241,.4); color: #FAF6F1; }

@media (max-width: 600px) {
  .pf-hero { padding: 64px 0 56px; }
  .pf-pipe li { font-size: 11px; }
  .pf-chapter { padding-top: 80px; }
  .pf-title { gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .pf *, .pf *::before, .pf *::after { animation: none !important; transition: none !important; }
}
</style>
