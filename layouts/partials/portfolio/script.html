<script>
(function () {
  var root = document.getElementById('pf');
  if (!root || !('IntersectionObserver' in window)) return;
  var chapters = Array.prototype.slice.call(root.querySelectorAll('.pf-chapter'));
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setStage(ch, n) {
    for (var i = 1; i <= 3; i++) ch.classList.toggle('s' + i, n >= i);
    var label = ch.querySelector('.pf-stage');
    var step = ch.querySelector('.pf-step[data-step="' + n + '"] .pf-step-label');
    if (label && step) label.textContent = step.textContent;
  }

  if (reduce) { chapters.forEach(function (ch) { setStage(ch, 3); }); return; }
  root.classList.add('js-on');

  // measure paths that draw themselves
  root.querySelectorAll('.draw').forEach(function (p) {
    try { p.style.setProperty('--len', Math.ceil(p.getTotalLength()) + 1); } catch (e) {}
  });

  // hero word stagger
  root.querySelectorAll('.pf-hero .pf-w').forEach(function (w, i) { w.style.animationDelay = (0.1 + i * 0.07) + 's'; });
  root.querySelectorAll('.pf-hero .pf-pipe li').forEach(function (li, i) { li.style.animationDelay = (0.9 + i * 0.4) + 's'; });

  // count-up
  function countUp(el) {
    if (el.dataset.done) return; el.dataset.done = '1';
    var to = parseFloat(el.dataset.to), pre = el.dataset.prefix || '', suf = el.dataset.suffix || '';
    var t0 = null, dur = 1400;
    function tick(t) {
      if (!t0) t0 = t;
      var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = pre + Math.round(to * e) + suf;
      if (k < 1) requestAnimationFrame(tick);
    }
    el.textContent = pre + '0' + suf;
    requestAnimationFrame(tick);
  }

  // steps drive the sticky visual
  var stepIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var step = en.target, ch = step.closest('.pf-chapter'), n = parseInt(step.dataset.step, 10);
      ch.querySelectorAll('.pf-step').forEach(function (s) { s.classList.toggle('is-active', s === step); });
      setStage(ch, n);
      if (n >= 3) ch.querySelectorAll('.pf-count').forEach(countUp);
    });
  }, { rootMargin: window.matchMedia('(min-width: 900px)').matches ? '-45% 0px -45% 0px' : '-66% 0px -26% 0px' });
  root.querySelectorAll('.pf-step').forEach(function (s) { stepIO.observe(s); });

  // one-shot reveals
  var revIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-in'); revIO.unobserve(en.target); } });
  }, { threshold: 0.2 });
  root.querySelectorAll('.rv, .pf-head').forEach(function (el) { revIO.observe(el); });

  // chapter rail
  var rail = root.querySelector('.pf-rail');
  var chIO = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting || !rail) return;
      rail.querySelectorAll('a').forEach(function (a) { a.classList.toggle('is-active', a.getAttribute('href') === '#' + en.target.id); });
    });
  }, { rootMargin: '-50% 0px -50% 0px' });
  chapters.forEach(function (c) { chIO.observe(c); });

  // progress bar + rail visibility
  var bar = root.querySelector('.pf-progress-bar'), first = chapters[0], outro = root.querySelector('.pf-outro'), ticking = false;
  function onScroll() {
    ticking = false;
    var h = document.documentElement.scrollHeight - window.innerHeight;
    if (bar) bar.style.transform = 'scaleX(' + (h > 0 ? window.scrollY / h : 0) + ')';
    if (rail && first && outro) {
      var y = window.innerHeight / 2;
      rail.classList.toggle('is-on', first.getBoundingClientRect().top < y && outro.getBoundingClientRect().top > y);
    }
  }
  // email showcase: each email scrolls through its frame as the page scrolls
  var mailRow = root.querySelector('.pf-mail-row');
  if (mailRow) revIO.observe(mailRow);
  var mails = Array.prototype.slice.call(root.querySelectorAll('.pf-mail-frame'));
  function moveMails() {
    if (!mails.length) return;
    var vh = window.innerHeight, r = mailRow.getBoundingClientRect();
    if (r.bottom < -200 || r.top > vh + 200) return;
    var p = Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height)));
    mails.forEach(function (f, i) {
      var img = f.querySelector('img'); if (!img) return;
      var max = img.offsetHeight - f.clientHeight; if (max <= 0) return;
      var k = Math.min(1, Math.max(0, (p - 0.08 - i * 0.04) / 0.8));
      img.style.transform = 'translateY(' + (-max * k).toFixed(1) + 'px)';
    });
  }
  window.addEventListener('scroll', function () { requestAnimationFrame(moveMails); }, { passive: true });
  window.addEventListener('resize', moveMails);
  window.addEventListener('load', moveMails);
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  onScroll();
})();
</script>
