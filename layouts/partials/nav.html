<div class="sticky top-0 z-50 w-full bg-[#FAF6F1] border-b border-[#1A1A1A]/10">
    <div x-data="{ open: false }" class="flex flex-col px-4 mx-auto max-w-full md:items-center md:justify-between md:flex-row md:px-6 lg:px-8">
        <div class="flex flex-row justify-between items-center p-4">
            <a href="/" class="flex items-center text-[#1A1A1A] transition duration-300 ease-in-out group">
                <img src="/images/site-logo.svg" width="36" height="36" class="w-9 h-9 transition-opacity group-hover:opacity-70" alt="{{ .Site.Title }} Logo" style="width: 36px; height: 36px;" />
                <div class="mt-1 ml-3 text-xl tracking-tight text-[#1A1A1A] uppercase transition-colors group-hover:text-[#B8925A]" style="font-family: 'Playfair Display', Georgia, serif; font-weight: 700;">
                    {{ .Site.Title }}</div>
            </a>
            <button class="rounded-lg text-[#1A1A1A] md:hidden focus:outline-none focus:shadow-outline" @click="open = !open" role="button" :aria-expanded="open" aria-label="Toggle navigation menu" aria-controls="menuItems">
                <svg fill="currentColor" viewBox="0 0 20 20" class="w-6 h-6">
                    <path x-show="!open" fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM9 15a1 1 0 011-1h6a1 1 0 110 2h-6a1 1 0 01-1-1z" clip-rule="evenodd"></path>
                    <path x-show="open" fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
            </button>
        </div>
        <nav id="menuItems" x-cloak :class="{'flex': open, 'hidden': !open}" class="hidden flex-col flex-grow pb-4 md:pb-0 md:flex md:justify-end md:flex-row">
            {{ range site.Menus.main }}
            {{ if (eq "dropdown" .Pre) }}
            <div @click.away="open = false" class="relative" x-data="{ open: false }">
                <button @click="open = !open" class="flex flex-row items-center px-4 py-2 mt-2 w-full text-sm font-semibold text-left text-[#1A1A1A] bg-transparent rounded-lg md:w-auto md:inline md:mt-0 md:ml-4 hover:text-white focus:text-white hover:bg-[#B8925A] focus:bg-[#B8925A] focus:outline-none focus:shadow-outline">
                    <span>{{ .Name }}</span>
                    <svg fill="currentColor" viewBox="0 0 20 20" :class="{'rotate-180': open, 'rotate-0': !open}" class="inline mt-1 ml-1 w-4 h-4 transition-transform duration-200 transform md:-mt-1">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                </button>
                <div x-show="open" x-transition:enter="transition ease-out duration-100" x-transition:enter-start="transform opacity-0 scale-95" x-transition:enter-end="transform opacity-100 scale-100" x-transition:leave="transition ease-in duration-75" x-transition:leave-start="transform opacity-100 scale-100" x-transition:leave-end="transform opacity-0 scale-95" class="absolute right-0 z-30 mt-2 w-full rounded-md shadow-lg origin-top-right md:w-48">
                    <div class="px-2 py-2 bg-white rounded-md shadow text-[#1A1A1A]">
                        {{ range (index site.Menus .Identifier) }}
                        <a class="block px-4 py-2 mt-2 text-sm font-semibold bg-transparent rounded-lg md:mt-0 hover:text-white focus:text-white hover:bg-[#B8925A] focus:bg-[#B8925A] focus:outline-none focus:shadow-outline" href="{{ .URL | absLangURL }}">{{- .Name -}}</a>
                        {{ end }}
                    </div>
                </div>
            </div>
            {{ else }}
            <a class="px-4 py-2 mt-2 text-sm font-semibold text-[#1A1A1A] rounded-lg md:mt-0 md:ml-4 hover:text-white focus:text-white hover:bg-[#B8925A] focus:bg-[#B8925A] focus:outline-none focus:shadow-outline" href="{{ .URL | absLangURL }}" title="{{ .Title | default .Name }}">
                {{ .Name }}
            </a>
            {{ end }}
            {{ end }}
        </nav>
    </div>
</div>
